name: 예약 발행 (완전자동 4채널, 2단계 배치)

# 2026-09-08부로 발행이 2단계로 나뉜다(docs/mainmanager-plan.md §1-1):
#   - 화요일 10:00 KST: 구글 블로그만 먼저 발행(--phase blog) — 검색 유입을 먼저 잡는다
#   - 목요일 20:00 KST: 나머지 3채널(페이스북·인스타그램·유튜브쇼츠)을 저녁 피크
#     시간대에 발행(--phase social) — 카드뉴스·숏츠로 재환기
# github.event.schedule로 어느 cron이 발화했는지 구분해 phase를 자동으로 정한다.
on:
  schedule:
    # 화요일 01:00 UTC = 화요일 10:00 KST — 블로그 배치
    - cron: "0 1 * * 2"
    # 목요일 11:00 UTC = 목요일 20:00 KST — 소셜 배치
    - cron: "0 11 * * 4"
  workflow_dispatch:
    inputs:
      phase:
        description: "발행 배치 선택 (수동 실행용)"
        type: choice
        options: ["all", "blog", "social"]
        default: "all"
      dry_run:
        description: "true면 실제로 게시하지 않고 각 단계에서 무엇을 올릴지만 로그로 출력 (안전한 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/publish/requirements.txt

      - name: 발행 배치(phase) 결정
        id: phase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.phase }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * 2" ]; then
            echo "value=blog" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 4" ]; then
            echo "value=social" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: 발행 실행
        env:
          PYTHONPATH: scripts/publish
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/publish/main.py --phase ${{ steps.phase.outputs.value }}

      # 위 스텝이 중간에 실패해도(일부 채널만 성공), 성공한 부분의 상태(_status.json)는
      # 반드시 커밋해서 다음 실행 때 중복 게시 없이 이어서 재시도할 수 있게 한다.
      - name: 발행 결과 커밋 (상태 갱신 / 완료 시 큐 삭제)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/
          if ! git diff --cached --quiet; then
            git commit -m "발행 처리 결과 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi

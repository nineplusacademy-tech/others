name: 예약 발행 (완전자동 4채널, 3단계 배치)

# 2026-09-09부로 발행이 3단계로 나뉜다(docs/mainmanager-plan.md §1-1).
# 2026-09-13부로 모든 배치를 오전 10:00 KST로 통일했다(요일은 그대로, 사용자 결정 —
# 저녁 피크 시간대 데이터보다 아침 일괄 배치의 단순함/일관성을 우선):
#   - 화요일 10:00 KST: 구글 블로그만 먼저 발행(--phase blog) — 검색 유입을 먼저 잡는다
#   - 수요일 10:00 KST: 카드뉴스 캐러셀 2채널(페이스북·인스타그램)만 발행(--phase cardnews)
#   - 목요일 10:00 KST: 릴스/쇼츠 3채널(페이스북·인스타그램·유튜브)을 발행(--phase social)
#     — 카드뉴스와는 다른 요일이라 같은 계정·같은 시각 노출 경쟁은 여전히 피한다
# github.event.schedule로 어느 cron이 발화했는지 구분해 phase를 자동으로 정한다.
#
# 2026-09-23 변경 — "정각 회피"(9/22 시도)는 효과가 없었다: 그날도 9/22 blog·edu
# 배치가 :06 예약인데 4시간52분 지연돼서야 실행됨. 2주치 실행 기록을 전부 대조한
# 결과, 예약 시각과 무관하게 거의 매번 **4.5~5.3시간** 늦게 실행되는 일정한
# 패턴을 확인했다(GitHub Free 플랜 예약 작업이 전역 낮은 우선순위 큐에서 처리되는
# 구조로 보임 — https://github.com/orgs/community/discussions/201738 동일 증상
# 보고). 정각을 피해도 이 지연 자체는 줄지 않았지만, **지연폭이 대체로 일정하다는
# 점을 거꾸로 이용**하기로 했다 — 실제로 화면에 뜨길 원하는 시각(10:00 KST)보다
# 5시간 앞서(전날 20:00 UTC = 새벽 05:00 KST) 예약해서, 지연을 거친 뒤 실제로는
# 원래 원하던 오전 시간대 근처에 실행되도록 노린다. 사용자에게 보이는 "10:00
# 배치"라는 표현은 그대로 유지한다(mainmanager-plan.md 등 문서는 안 고침) — 이건
# 실제 예약 파일에서만 적용하는 우회 전략이고, 100% 정확히 10:00에 맞는다는
# 보장은 아니다(지연폭 자체가 4.5~5.3시간 사이에서 흔들리고, 가끔 13~14시간까지
# 튄 전례도 있음 — 다음 몇 주 지켜보고 필요하면 다시 조정한다).
on:
  schedule:
    # 월요일 20:06 UTC(=화요일 05:06 KST) 예약 → 지연 반영 시 화요일 오전 실행
    # 목표 — 블로그 배치
    - cron: "6 20 * * 1"
    # 화요일 20:06 UTC(=수요일 05:06 KST) 예약 → 수요일 오전 실행 목표 — 카드뉴스 배치
    - cron: "6 20 * * 2"
    # 수요일 20:06 UTC(=목요일 05:06 KST) 예약 → 목요일 오전 실행 목표 — 소셜(릴스/쇼츠) 배치
    - cron: "6 20 * * 3"
  workflow_dispatch:
    inputs:
      phase:
        description: "발행 배치 선택 (수동 실행용)"
        type: choice
        options: ["all", "blog", "cardnews", "social"]
        default: "all"
      dry_run:
        description: "true면 실제로 게시하지 않고 각 단계에서 무엇을 올릴지만 로그로 출력 (안전한 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/publish/requirements.txt

      - name: 발행 배치(phase) 결정
        id: phase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.phase }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "6 20 * * 1" ]; then
            echo "value=blog" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "6 20 * * 2" ]; then
            echo "value=cardnews" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "6 20 * * 3" ]; then
            echo "value=social" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: 발행 실행
        env:
          PYTHONPATH: scripts/publish
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/publish/main.py --phase ${{ steps.phase.outputs.value }}

      # 위 스텝이 중간에 실패해도(일부 채널만 성공), 성공한 부분의 상태(_status.json)는
      # 반드시 커밋해서 다음 실행 때 중복 게시 없이 이어서 재시도할 수 있게 한다.
      - name: 발행 결과 커밋 (상태 갱신 / 완료 시 큐 삭제)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/
          if ! git diff --cached --quiet; then
            git commit -m "발행 처리 결과 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi

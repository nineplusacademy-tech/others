name: 페이스북 글(교육뉴스·메인 블로그) 자동 게시

# 2026-10-30 신설(사용자 지시). 교육뉴스(월)·메인 블로그(화) 네이버 글을 소개하는 페이스북 페이지
# 글을 올린다. 네이버 글이 공개되기 전이면 미뤘다가 다음 실행에서 다시 시도한다(스레드와 같은 방식).
# 예약은 GitHub Free 플랜의 4~5시간 지연을 고려해 목표(월·화 10:00대)보다 5시간쯤 앞당겨 두 번씩:
#   - 일요일 22:37 UTC·월요일 03:37 UTC (월요일 07:37·12:37 KST 목표) — 교육뉴스
#   - 월요일 22:37 UTC·화요일 03:37 UTC (화요일 07:37·12:37 KST 목표) — 메인 블로그
# 게시할 게 없거나 이미 게시됐으면 아무것도 안 한다. 수동 실행도 가능(dry_run 지원).
on:
  schedule:
    - cron: "37 22 * * 0,1"
    - cron: "37 3 * * 1,2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 실제로 게시하지 않고 무엇을 올릴지만 로그로 출력"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/publish/requirements.txt

      - name: 페이스북 글 게시
        env:
          PYTHONPATH: scripts/publish
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python scripts/publish/main_fb_post.py

      - name: 발행 결과 커밋 (사용한 파일 삭제·상태 반영)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A queue/
          if ! git diff --cached --quiet; then
            git commit -m "페이스북 글 발행 결과 갱신 [skip ci]"
            git pull --rebase
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi

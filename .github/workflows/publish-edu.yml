name: 교육뉴스 발행 (구글 블로그만 완전자동)

on:
  schedule:
    # 월요일 03:00 UTC = 월요일 12:00 KST (아침 주제 확정+원고 작성+승인 여유를 둔 시각)
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 실제로 게시하지 않고 무엇을 올릴지만 로그로 출력 (안전한 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-edu-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/publish/requirements.txt

      - name: 교육뉴스 구글 블로그 발행
        env:
          PYTHONPATH: scripts/publish
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/publish/main_edu.py

      # queue-edu/ 안에 그 주 교육뉴스 폴더가 없으면(사용자가 아직 승인 전이라 큐에
      # 올리지 않았으면) 위 스텝이 조용히 "발행할 콘텐츠 없음"으로 끝난다 — 정상이다.
      - name: 발행 결과 커밋 (완료 시 큐 삭제)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue-edu/
          if ! git diff --cached --quiet; then
            git commit -m "교육뉴스 발행 처리 결과 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi

name: 교육뉴스 발행 (구글 블로그만 완전자동)

on:
  schedule:
    # 2026-09-21 변경: 다음 주(9/28)부터 교육뉴스는 월요일 10:00 KST 발행(월요일 01:00 UTC).
    # 화요일 실행은 (a) 9/22 분(이미 화요일 발행으로 큐 등록됨)과 (b) 월요일 실패 시
    # 재시도용으로 남겨둔다 — 월요일에 발행되면 큐 폴더가 삭제돼 화요일 실행은 할 일이 없다.
    # (이전: 2026-09-08 화요일 10:00 KST, 그 이전 월요일 12:00 KST)
    # 2026-09-22 변경: 분을 :00에서 :12로 옮겼다 — 매시 정각 congestion 회피
    # (publish.yml과 같은 이유), 메인 블로그 배치(:06)와도 겹치지 않게 분산.
    - cron: "12 1 * * 1,2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 실제로 게시하지 않고 무엇을 올릴지만 로그로 출력 (안전한 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-edu-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/publish/requirements.txt

      - name: 교육뉴스 구글 블로그 발행
        env:
          PYTHONPATH: scripts/publish
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/publish/main_edu.py

      # queue-edu/ 안에 그 주 교육뉴스 폴더가 없으면(사용자가 아직 승인 전이라 큐에
      # 올리지 않았으면) 위 스텝이 조용히 "발행할 콘텐츠 없음"으로 끝난다 — 정상이다.
      - name: 발행 결과 커밋 (완료 시 큐 삭제)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue-edu/
          if ! git diff --cached --quiet; then
            git commit -m "교육뉴스 발행 처리 결과 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi

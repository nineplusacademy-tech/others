name: 스레드(메인 블로그) 자동 게시

# 2026-09-13부로 12:30 KST → 10:15 KST로 앞당김(docs/mainmanager-plan.md §1-1,
# 모든 콘텐츠 업로드를 오전 10시대로 통일하라는 사용자 결정). 정확히 10:00으로는
# 둘 수 없다 — 블로그 배치(10:00)가 끝난 뒤 사람이 네이버 블로그 URL을
# set_naver_url.py로 기록해야만(naver-blog-url-reminder, 10:05 안내) 이 스레드가
# 그 링크를 채워 게시할 수 있기 때문에, 최소한의 버퍼로 10:15을 유지한다. URL이
# 아직 기록되지 않았으면 에러로 멈추고 잘못된 링크로 게시하지는 않는다
# (main_thread.py) — 이 경우 URL 기록 후 workflow_dispatch로 수동 재실행한다.
# main.py의 3단계 배치와는 독립적으로 실행된다. queue/의 스레드.md가 없으면
# (이미지 첨부 주 등, content-playbook.md §9) 조용히 건너뛴다.
#
# 2026-09-23 변경: publish.yml과 같은 이유(예약 시각과 무관한 4.5~5.3시간 지연,
# GitHub Free 플랜 낮은 우선순위 큐 — publish.yml 상단 주석 참고)로, 목표
# 10:15 KST보다 5시간 앞선 전날 20:15 UTC(=05:15 KST)에 예약한다. 블로그 배치도
# 같은 폭(-5시간)으로 당겨뒀으므로, 지연을 거친 뒤에도 블로그 완료 직후라는
# 상대적 순서는 유지될 것으로 기대한다.
on:
  schedule:
    - cron: "15 20 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 실제로 게시하지 않고 무엇을 올릴지만 로그로 출력"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/publish/requirements.txt

      - name: 스레드 게시
        env:
          PYTHONPATH: scripts/publish
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/publish/main_thread.py

      - name: 발행 결과 커밋 (상태 갱신)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/
          if ! git diff --cached --quiet; then
            git commit -m "스레드 발행 결과 갱신 [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
